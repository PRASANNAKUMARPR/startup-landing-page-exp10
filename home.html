
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>StartUp</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#register">Register</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to Our Startup</h1>
    <p>Register with us and build your future.</p>
</section>

<section id="register">
    <div class="form-container">

        <h2>User Registration Form</h2>

        <form action="/register" method="POST">

            <label>Name *</label>
            <input type="text" name="name" required>

            <label>Password *</label>
            <input type="password" name="password" required>

            <label>Age *</label>
            <input type="number" name="age" min="1" required>

            <label>Mobile Number *</label>
            <input type="tel" name="mobile"
                   pattern="[0-9]{10}" required>

            <label>Email *</label>
            <input type="email" name="email" required>

            <label>Gender *</label>
            <div class="options">
                <label><input type="radio" name="gender"
                       value="Male" required> Male</label>

                <label><input type="radio" name="gender"
                       value="Female"> Female</label>
            </div>

            <label>State *</label>
            <select name="state" required>
                <option value="">Select State</option>
                <option>Tamil Nadu</option>
                <option>Kerala</option>
                <option>Karnataka</option>
                <option>Andhra Pradesh</option>
            </select>

            <label>Skills</label>
            <div class="options">
                <label><input type="checkbox" name="skills"
                    value="JavaScript"> JavaScript</label>

                <label><input type="checkbox" name="skills"
                    value="Python"> Python</label>

                <label><input type="checkbox" name="skills"
                    value="C++"> C++</label>

                <label><input type="checkbox" name="skills"
                    value="Java"> Java</label>
            </div>

            <button type="submit">Submit</button>

        </form>

    </div>
</section>

<footer>
    <p>Copyright 2026 StartUp. All Rights Reserved.</p>
</footer>

</body>
</html>
